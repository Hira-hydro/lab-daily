{% extends "base.html" %}
{% block content %}
<h2>アクセスログ（最新100件）</h2>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>ユーザー</th>
            <th>アクション</th>
            <th>IPアドレス</th>
            <th>日時</th>
        </tr>
    </thead>
    <tbody>
        {% for log in logs %}
        <tr>
            <td>{{ log.user.username if log.user else "不明" }}</td>
            <td>{{ log.action }}</td>
            <td>{{ log.ip_address }}</td>
            <td>{{ log.timestamp }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
