{% extends "base.html" %}
{% block content %}
<h2>ユーザー管理</h2>

<h4>新規ユーザー追加</h4>
<form method="POST" class="mb-4">
    <div class="mb-3">
        <label class="form-label">ユーザー名</label>
        <input type="text" name="username" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">パスワード</label>
        <input type="password" name="password" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">権限</label>
        <select name="role" class="form-select">
            <option value="user">一般ユーザー</option>
            <option value="admin">管理者</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">追加</button>
</form>

<h4>既存ユーザー一覧</h4>
<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>ユーザー名</th>
            <th>権限</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        {% for u in users %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.username }}</td>
            <td>{{ u.role }}</td>
            <td>
                {% if u.id != user.id %}
                    <form action="{{ url_for('delete_user', user_id=u.id) }}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-danger"
                                onclick="return confirm('本当に削除しますか？');">削除</button>
                    </form>
                    <form action="{{ url_for('toggle_role', user_id=u.id) }}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-secondary">権限変更</button>
                    </form>
                {% else %}
                    <span class="text-muted">（自分自身）</span>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
