{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4 text-center">{{ record.user.username }} さんの記録編集</h2>

        <form method="POST">
            <div class="mb-3">
                <label for="clock_in" class="form-label">出勤</label>
                <input type="datetime-local" name="clock_in" id="clock_in"
                       class="form-control"
                       value="{{ record.clock_in.strftime('%Y-%m-%dT%H:%M') if record.clock_in else '' }}">
            </div>

            <div class="mb-3">
                <label for="clock_out" class="form-label">退勤</label>
                <input type="datetime-local" name="clock_out" id="clock_out"
                       class="form-control"
                       value="{{ record.clock_out.strftime('%Y-%m-%dT%H:%M') if record.clock_out else '' }}">
            </div>

            <div class="mb-3">
                <label for="note" class="form-label">日誌</label>
                <textarea name="note" id="note" rows="5" class="form-control">{{ record.note or "" }}</textarea>
            </div>

            <div class="d-flex justify-content-between">
                <a href="{{ url_for('records') }}" class="btn btn-secondary">戻る</a>
                <button type="submit" class="btn btn-primary">更新</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
