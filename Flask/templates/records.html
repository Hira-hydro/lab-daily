{% extends "base.html" %}
{% block content %}
<h2>記録一覧</h2>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>ユーザー</th>
            <th>日付</th>
            <th>出勤</th>
            <th>退勤</th>
            <th>日誌</th>
            {% if is_admin %}
            <th>操作</th>
            {% endif %}
        </tr>
    </thead>
    <tbody>
        {% for r in records %}
        <tr>
            <td>{{ r.user.username }}</td>
            <td>{{ r.date }}</td>
            <td>{{ r.clock_in or "" }}</td>
            <td>{{ r.clock_out or "" }}</td>
            <td>{{ r.note or "" }}</td>
            {% if is_admin %}
            <td>
                <a href="{{ url_for('edit_record', record_id=r.id) }}" class="btn btn-sm btn-warning">編集</a>
                <form action="{{ url_for('delete_record', record_id=r.id) }}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('本当に削除しますか？');">削除</button>
            </td>
            {% endif %}
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
